<style>*{box-sizing:border-box}body{margin:0;background:#f2f7f3;color:#173b2d;font-family:Inter,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:34px 20px;background:radial-gradient(circle at 50% 0,#e5f3ea,#f7faf7 55%,#fff);position:relative;overflow:hidden}.hero:before,.hero:after{content:"";position:absolute;width:260px;height:260px;border:1px solid #d4b65b55;transform:rotate(45deg);border-radius:32px;pointer-events:none}.hero:before{left:-190px;top:10%}.hero:after{right:-190px;bottom:5%}.ornament{color:#c7a54a;font-size:42px}.logo-slot{width:90px;height:90px;border:2px dashed #b99a4b;border-radius:50%;display:grid;place-items:center;color:#8b753e;font-size:10px;line-height:1.4;margin:8px auto 18px;background:#fff}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:#987b31}.hero h1{font-size:clamp(32px,6vw,56px);line-height:1.08;margin:12px 0;color:#10533b}.hero h1 em{font-style:normal;color:#bd963a}.year{color:#648074;margin-top:0}.bism{font-family:Amiri,serif;font-size:30px;color:#15583e;margin:14px 0}.verse{max-width:590px;padding:15px 22px;background:#fff;border:1px solid #eadcae;border-radius:16px;line-height:1.65;color:#536b5f;margin:10px auto 22px}.verse strong{color:#9a7b2d}.primary{border:0;background:#14583e;color:white;padding:15px 25px;border-radius:12px;font-weight:800;box-shadow:0 8px 18px #0c51301f}.primary:hover{background:#0e432f}.primary span{margin-left:18px}.full{width:100%;margin-top:10px}.linkbtn,.back{border:0;background:none;color:#547568;padding:13px}.small{font-size:12px}.muted{color:#71877c}.panel{max-width:760px;margin:35px auto;padding:30px;background:white;border:1px solid #e1ebe3;border-radius:22px;box-shadow:0 12px 36px #143c2410}.narrow{max-width:510px}.panel h2{font-size:28px;margin:8px 0}.panel label{display:block;font-weight:700;font-size:13px;margin:18px 0;color:#355a4 ackground:#fff9e9}.navigator{background:white;padding:18px;border:1px solid #e0e9e2;border-radius:16px;margin:20px 0}.numbers,.reviewgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin:13px 0}.numbers button,.reviewgrid button{border:1px solid #dce6de;border-radius:8px;padding:9px 2px;background:#fff;color:#456353}.numbers button.answered,.reviewgrid button.answered{background:#e3f3e8;border-color:#76b58c}.numbers button.here{outline:2px solid #c29e42}.numbers button.flagged{box-shadow:inset 0 -3px #d1a63c}.submitbtn{width:100%;padding:13px;border:0;border-radius:10px;background:#f3e9c9;color:#6e541c;font-weight:800}.result{text-align:center;max-width:600px;margin:45px auto;padding:32px 20px;background:#fff;border:1px solid #e3eade;border-radius:24px}.smalllogo{width:58px;height:58px;font-size:26px;border-style:solid}.result h1{color:#15583e;margin:8px}.score{font-size:76px;font-weight:800;color:#16583e;margin:18px 0 0}.score small{font-size:20px;color:#8a9a90}.stars{font-size:36px;letter-spacing:5px;color:#c6a13e}.resultstats{display:flex;justify-content:center;gap:12px;margin:22px 0}.resultstats div{background:#f2f7f3;border-radius:12px;padding:13px 18px;min-width:85px}.resultstats b,.resultstats span{display:block}.resultstats b{font-size:23px}.resultstats span{font-size:11px;color:#71877c}.motivation{line-height:1.7;background:#fff9e9;padding:17px;border-radius:13px;color:#6f5a2c}.dashboard h1{margin-top:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stats div{background:#fff;border:1px solid #e1e9e2;border-radius:14px;padding:18px}.stats small,.stats b{display:block}.stats small{color:#75887d}.stats b{font-size:27px;margin-top:7px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}.chartbox{background:#fff;border:1px solid #e1e9e2;border-radius:15px;padding:18px}.chartbox h3{margin:0 0 12px}.bars{height:160px;display:flex;align-items:end;justify-content:space-around;border-bottom:1px solid #d9e3dc}.bars div{height:100%;width:25%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px;font-size:11px}.bars i{width:48%;min-height:2px;background:#24734f;border-radius:7px 7px 0 0}.bars div:nth-child(2) i{background:#c4a149}.bars div:nth-child(3) i{background:#b76d59}.donut{width:130px;height:130px;border-radius:50%;margin:10px auto;background:conic-gradient(#24734f 0 calc(var(--a)*1%),#c4a149 calc(var(--a)*1%) calc(var(--b)*1%),#b76d59 calc(var(--b)*1%) 100%);position:relative}.donut:after{content:"";position:absolute;inset:28px;background:#fff;border-radius:50%}.chartbox p{font-size:12px;text-align:center;color:#667e71}.tablehead{display:flex;align-items:center;gap:9px;margin:22px 0 10px;flex-wrap:wrap}.tablehead h3{margin-right:auto}.tablehead input{width:220px;margin:0}.tablewrap{overflow:auto;background:#fff;border:1px solid #e1e9e2;border-radius:13px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:12px;text-align:left;border-bottom:1px solid #edf1ed;white-space:nowrap}th{background:#f3f7f3;color:#52705e}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#183e2e;color:white;padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:9;max-width:90vw}.toast.show{opacity:1}@media(max-width:650px){.panel{margin:14px;padding:22px 17px}.question{padding:18px}.question h2{font-size:18px}.exam-actions{flex-wrap:wrap}.exam-actions button{flex:1}.numbers,.reviewgrid{grid-template-columns:repeat(5,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}.tablehead input{width:100%;order:3}.hero{min-height:100svh}.bism{font-size:25px}.resultstats{gap:6px}.resultstats div{min-width:0;flex:1;padding:12px 7px}.examhead{padding:12px 14px}}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.ASESMEN_CONFIG = {
  SUPABASE_URL: "https://PROJECT_REF.supabase.co",
  SUPABASE_ANON_KEY: "ISI_SUPABASE_ANON_PUBLIC_KEY"
};
</script></head><body>
<div id="app"><main class="panel narrow"><h2>Memuat Asesmen Fikih Online 2026…</h2><p>Mohon tunggu.</p></main></div>
<script>const { createClient } = window.supabase;
const SUPABASE_URL = window.ASESMEN_CONFIG.SUPABASE_URL;
const SUPABASE_ANON_KEY = window.ASESMEN_CONFIG.SUPABASE_ANON_KEY;
const EXAM_YEAR = "2026/2027";
const SCHOOL_NAME = "MTs RAUDLATUL ULUM VI";

const $ = (s, root=document) => root.querySelector(s);
const $$ = (s, root=document) => [...root.querySelectorAll(s)];
const app = $("#app");
let sb=null, studentToken=null, attempt=null, questions=[], answers={}, flags=new Set(), current=0, timer=null, deadline=null, adminRows=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>`${String(Math.floor(s/3600)).padStart(2,"0")}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function shell(html){app.innerHTML=html;}
function toast(message){const n=$("#toast");if(n){n.textContent=message;n.classList.add("show");setTimeout(()=>n.classList.remove("show"),3500);}}
function configReady(){return SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("PROJECT_REF") && SUPABASE_ANON_KEY.length>20 && !SUPABASE_ANON_KEY.startsWith("ISI_");}
async function rpc(name,args={}){if(!sb)throw Error("Supabase belum dikonfigurasi.");const {data,error}=await sb.rpc(name,args);if(error)throw Error(error.message);if(data?.error)throw Error(data.error);return data;}
function landing(){shell(`<main class="hero"><div class="ornament">۞</div><div class="logo-slot"><span>UNGGAH LOGO<br>PESANTREN</span></div><p class="eyebrow">${SCHOOL_NAME}</p><h1>ASESMEN FIKIH<br><em>ONLINE 2026</em></h1><p class="year">Tahun Ajaran ${EXAM_YEAR}</p><div class="bism">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><div class="verse"><strong>QS. Al-Mujadilah: 11</strong><p>“...Niscaya Allah akan mengangkat (derajat) orang-orang yang beriman di antaramu dan orang-orang yang diberi ilmu beberapa derajat.”</p></div><button class="primary" id="start">MULAI ASESMEN <span>→</span></button><button class="linkbtn" id="adminLink">Masuk Admin/Guru</button><p class="small muted">Kerjakan dengan jujur, teliti, dan penuh tanggung jawab.</p></main><div id="toast" class="toast"></div>`);
$("#start").onclick=studentLogin;$("#adminLink").onclick=adminLogin;}
function studentLogin(){shell(`<main class="panel narrow"><button class="back" id="back">← Kembali</button><div class="eyebrow">AKSES PESERTA</div><h2>Masuk Asesmen</h2><p class="muted">Gunakan nomor peserta dan PIN yang diberikan guru.</p><form id="studentForm"><label>Nomor peserta<input name="no" required maxlength="30" autocomplete="username" placeholder="Contoh: FIKIH001"></label><label>PIN ujian<input name="pin" required type="password" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" placeholder="PIN 4–8 angka"></label><button class="primary full">VERIFIKASI & MULAI</button></form><p class="small muted">Setiap nomor peserta hanya dapat mengikuti ujian satu kali. Jika pernah memulai ujian, gunakan perangkat yang sama atau hubungi guru.</p></main><div id="toast" class="toast"></div>`);
$("#back").onclick=landing;$("#studentForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const btn=$("button",e.target);btn.disabled=true;btn.textContent="Memverifikasi...";try{const data=await rpc("student_start_exam",{p_participant_no:String(f.get("no")).trim(),p_pin:String(f.get("pin")).trim()});studentToken=data.token;attempt=data.attempt;questions=data.questions;answers={};flags=new Set();current=0;deadline=new Date(data.deadline_at);localStorage.setItem("fikih_ruvi_session",JSON.stringify({token:studentToken,participant:data.participant,attempt,questions,deadline:data.deadline_at}));renderQuestion();startTimer();}catch(err){toast(err.message);}finally{btn.disabled=false;btn.textContent="VERIFIKASI & MULAI";}};}
function startTimer(){clearInterval(timer);const tick=()=>{const left=Math.max(0,Math.ceil((deadline.getTime()-Date.now())/1000));const el=$("#clock");if(el)el.textContent=fmt(left);if(left===600)toast("Waktu tersisa 10 menit.");if(left===300)toast("Waktu tersisa 5 menit.");if(left<=0){clearInterval(timer);submitExam(true);}};tick();timer=setInterval(tick,1000);}
async function saveAnswer(qid,displayIndex){const status=$("#sync");if(status)status.textContent="Menyimpan...";try{await rpc("student_save_answer",{p_token:studentToken,p_question_id:qid,p_display_index:displayIndex});if(status)status.textContent="Tersimpan";}catch(e){if(status)status.textContent="Belum tersimpan";toast("Jawaban belum tersimpan: "+e.message);}}
function persistLocal(){if(studentToken&&attempt&&deadline)localStorage.setItem("fikih_ruvi_session",JSON.stringify({token:studentToken,attempt,questions,deadline:deadline.toISOString(),localAnswers:answers}));}
function answeredCount(){return Object.keys(answers).length;}
function renderQuestion(){const q=questions[current],selected=answers[q.id];shell(`<header class="examhead"><div><b>ASESMEN FIKIH 2026</b><small>${esc(attempt.full_name)} · ${esc(attempt.class_name)} · ${esc(attempt.participant_no)}</small></div><div class="clock" id="clock">${fmt(Math.max(0,Math.ceil((deadline-Date.now())/1000)))}</div></header><main class="exam"><div class="progressline"><span>${answeredCount()}/50 dijawab</span><span>Soal ${current+1} dari 50</span></div><div class="progress"><i style="width:${answeredCount()*2}%"></i></div><div class="topic">${esc(q.topic)}</div><article class="question"><div class="qnum">PERTANYAAN ${current+1}</div><h2>${esc(q.prompt)}</h2><div class="choices">${q.options.map((o,i)=>`<button class="choice ${selected===i?"selected":""}" data-choice="${i}"><b>${"ABCDE"[i]}</b><span>${esc(o)}</span></button>`).join("")}</div></article><div class="exam-actions"><button class="secondary" id="prev" ${current===0?"disabled":""}>Sebelumnya</button><button class="flag ${flags.has(q.id)?"on":""}" id="flag">${flags.has(q.id)?"★ Ditandai":"☆ Tandai ragu"}</button><button class="primary" id="next">${current===49?"Tinjau jawaban":"Berikutnya"}</button></div><section class="navigator"><b>Navigasi soal</b><div class="numbers">${questions.map((x,i)=>`<button data-n="${i}" class="${answers[x.id]!==undefined?"answered":""} ${i===current?"here":""} ${flags.has(x.id)?"flagged":""}">${i+1}</button>`).join("")}</div><div class="syncrow"><span>● Terjawab　○ Belum　★ Ditandai</span><span id="sync">Jawaban tersimpan di server</span></div><button class="submitbtn" id="review">Tinjau & kumpulkan jawaban</button></section></main><div id="toast" class="toast"></div>`);
$$(".choice").forEach(b=>b.onclick=async()=>{const idx=Number(b.dataset.choice);answers[q.id]=idx;persistLocal();renderQuestion();await saveAnswer(q.id,idx);});
$("#prev").onclick=()=>{current--;renderQuestion();};$("#next").onclick=()=>{if(current===49)review();else{current++;renderQuestion();}};
$("#flag").onclick=()=>{flags.has(q.id)?flags.delete(q.id):flags.add(q.id);renderQuestion();};
$$("[data-n]").forEach(b=>b.onclick=()=>{current=Number(b.dataset.n);renderQuestion();});$("#review").onclick=review;}
function review(){const unanswered=50-answeredCount();shell(`<main class="panel"><div class="eyebrow">PEMERIKSAAN AKHIR</div><h2>Tinjau Jawaban</h2><p>Terjawab <b>${answeredCount()}</b> dari 50 soal. Belum dijawab <b>${unanswered}</b> soal.</p><div class="reviewgrid">${questions.map((q,i)=>`<button data-r="${i}" class="${answers[q.id]!==undefined?"answered":"empty"}">${i+1}</button>`).join("")}</div><p class="muted small">Setelah dikumpulkan, jawaban tidak dapat diubah. Pastikan koneksi internet stabil.</p><div class="exam-actions"><button class="secondary" id="resume">Kembali mengerjakan</button><button class="primary" id="send">Kumpulkan jawaban</button></div></main><div id="toast" class="toast"></div>`);$$("[data-r]").forEach(b=>b.onclick=()=>{current=Number(b.dataset.r);renderQuestion();});$("#resume").onclick=renderQuestion;$("#send").onclick=()=>{if(confirm("Yakin mengumpulkan jawaban? Jawaban tidak dapat diubah."))submitExam(false);};}
async function submitExam(auto){if(timer)clearInterval(timer);try{const r=await rpc("student_submit_exam",{p_token:studentToken});localStorage.removeItem("fikih_ruvi_session");renderResult(r);}catch(e){toast((auto?"Waktu habis, tetapi ":"")+"pengumpulan belum terkonfirmasi: "+e.message);if(!auto)review();else setTimeout(()=>submitExam(true),5000);}}
function renderResult(r){const stars=r.score===100?3:r.score>=91?2:r.score>=70?1:0;const messages={100:"Masyaallah! Luar biasa! Kamu berhasil mendapatkan nilai sempurna. Pertahankan semangat menuntut ilmu dan teruslah menjadi pribadi yang berprestasi.",high:"Alhamdulillah! Hasil yang sangat membanggakan. Pertahankan prestasimu dan terus tingkatkan kemampuan belajar.",mid:"Alhamdulillah, kamu sudah berusaha dengan baik. Terus tingkatkan pemahaman dan jangan berhenti belajar.",low:"Jangan menyerah! Kegagalan bukan akhir dari perjalanan. Jadikan hasil ini sebagai motivasi untuk belajar lebih giat. Terus berusaha, berdoa, dan yakinlah bahwa kamu bisa meraih hasil yang lebih baik."};const message=r.score===100?messages[100]:r.score>=91?messages.high:r.score>=70?messages.mid:messages.low;shell(`<main class="result"><div class="logo-slot smalllogo">۞</div><div class="eyebrow">HASIL ASESMEN FIKIH</div><h1>Alhamdulillah!</h1><p>Asesmen telah berhasil dikumpulkan.</p><p><b>${esc(attempt.full_name)}</b><br>${esc(attempt.class_name)} · ${esc(attempt.participant_no)}</p><div class="score">${r.score}<small>/100</small></div><p class="muted">Persentase pencapaian ${r.score}%</p><div class="stars">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div><div class="resultstats"><div><b>${r.correct_count}</b><span>Benar</span></div><div><b>${r.wrong_count}</b><span>Salah</span></div><div><b>${r.unanswered_count}</b><span>Kosong</span></div></div><p class="motivation">${message}</p><p class="muted">Terima kasih telah mengikuti Asesmen Fikih Online 2026.</p></main>`);}
async function restoreSession(){try{const raw=localStorage.getItem("fikih_ruvi_session");if(!raw)return false;const s=JSON.parse(raw);studentToken=s.token;attempt=s.attempt;questions=s.questions;deadline=new Date(s.deadline);const status=await rpc("student_session_status",{p_token:studentToken});if(status.submitted){localStorage.removeItem("fikih_ruvi_session");renderResult(status.result);return true;}if(Date.now()>=deadline.getTime()){await submitExam(true);return true;}const saved=await rpc("student_get_answers",{p_token:studentToken});answers={...(s.localAnswers||{}),...(saved.answers||{})};persistLocal();renderQuestion();startTimer();for(const [qid,idx] of Object.entries(s.localAnswers||{})){if(saved.answers?.[qid]!==idx)saveAnswer(Number(qid),idx);}return true;}catch(e){localStorage.removeItem("fikih_ruvi_session");return false;}}
async function adminLogin(){shell(`<main class="panel narrow"><button class="back" id="back">← Kembali</button><div class="eyebrow">AREA TERBATAS</div><h2>Login Admin/Guru</h2><form id="adminForm"><label>Email admin<input name="email" type="email" required autocomplete="username"></label><label>Kata sandi<input name="password" type="password" required autocomplete="current-password"></label><button class="primary full">MASUK DASHBOARD</button></form><div id="toast" class="toast"></div></main>`);$("#back").onclick=landing;$("#adminForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {data,error}=await sb.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});if(error){toast("Login gagal: "+error.message);return;}await dashboard();};}
async function dashboard(){try{const d=await rpc("admin_dashboard");adminRows=d.rows||[];renderDashboard(d);}catch(e){await sb.auth.signOut();landing();toast("Akses dashboard ditolak: "+e.message);}}
function renderDashboard(d){const rows=d.rows||[],cats=d.categories; shell(`<header class="examhead"><b>ADMIN · ASESMEN FIKIH 2026</b><button class="secondary" id="logout">Keluar</button></header><main class="dashboard"><div class="eyebrow">DASHBOARD GURU</div><h1>Rekap Hasil Asesmen</h1><div class="stats"><div><small>Total peserta</small><b>${d.total}</b></div><div><small>Sudah mengumpulkan</small><b>${d.completed}</b></div><div><small>Rata-rata nilai</small><b>${d.average}</b></div><div><small>Nilai tertinggi</small><b>${d.highest}</b></div><div><small>Belum mulai</small><b>${d.not_started}</b></div><div><small>Sedang mengerjakan</small><b>${d.in_progress}</b></div><div><small>Nilai terendah</small><b>${d.lowest}</b></div></div><div class="charts"><section class="chartbox"><h3>Distribusi kategori nilai</h3><div class="bars"><div><i style="height:${d.completed?cats.high/d.completed*100:0}%"></i><span>Tinggi ${cats.high}</span></div><div><i style="height:${d.completed?cats.mid/d.completed*100:0}%"></i><span>Sedang ${cats.mid}</span></div><div><i style="height:${d.completed?cats.low/d.completed*100:0}%"></i><span>Rendah ${cats.low}</span></div></div></section><section class="chartbox"><h3>Komposisi kategori</h3><div class="donut" style="--a:${d.completed?cats.high/d.completed*100:0};--b:${d.completed?(cats.high+cats.mid)/d.completed*100:0}"></div><p>Tinggi ${pct(cats.high,d.completed)}% · Sedang ${pct(cats.mid,d.completed)}% · Rendah ${pct(cats.low,d.completed)}%</p></section></div><div class="tablehead"><h3>Daftar peserta</h3><button class="primary" id="addParticipant">+ Tambah peserta</button><input id="search" placeholder="Cari nama, kelas, nomor peserta"><button class="secondary" id="csv">Unduh CSV</button><button class="secondary" id="print">Cetak</button></div><section class="panel admin-add hidden" id="addBox"><h3>Tambah peserta baru</h3><form id="addParticipantForm" class="admin-form"><label>Nama lengkap<input name="name" required maxlength="100"></label><label>Kelas<input name="class" required placeholder="Contoh: VII A"></label><label>Nomor peserta<input name="no" required maxlength="30"></label><label>PIN 4–8 angka<input name="pin" required pattern="[0-9]{4,8}" maxlength="8" inputmode="numeric"></label><button class="primary">Simpan peserta</button><button type="button" class="secondary" id="cancelAdd">Batal</button></form><p class="small muted">Bagikan nomor peserta dan PIN secara pribadi kepada siswa.</p></section><div class="tablewrap"><table><thead><tr><th>Nama</th><th>Kelas</th><th>No. Peserta</th><th>Benar</th><th>Salah</th><th>Nilai</th><th>Status</th><th>Aksi admin</th></tr></thead><tbody id="rows"></tbody></table></div><p class="small muted">Data ini hanya dapat dilihat oleh akun guru yang terdaftar sebagai admin.</p></main>`);renderRows(rows);$("#search").oninput=e=>renderRows(rows.filter(r=>[r.full_name,r.class_name,r.participant_no].join(" ").toLowerCase().includes(e.target.value.toLowerCase())));$("#addParticipant").onclick=()=>$("#addBox").classList.toggle("hidden");$("#cancelAdd").onclick=()=>$("#addBox").classList.add("hidden");$("#addParticipantForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await rpc("admin_create_participant",{p_name:f.get("name"),p_class:f.get("class"),p_no:f.get("no"),p_pin:f.get("pin")});toast("Peserta berhasil ditambahkan.");await dashboard();}catch(err){toast(err.message);}};$("#logout").onclick=async()=>{await sb.auth.signOut();landing();};$("#print").onclick=()=>window.print();$("#csv").onclick=()=>downloadCSV(rows);}
function pct(n,total){return total?((n/total)*100).toFixed(1):"0.0";}
function renderRows(rows){$("#rows").innerHTML=rows.map(r=>`<tr><td>${esc(r.full_name)}</td><td>${esc(r.class_name)}</td><td>${esc(r.participant_no)}</td><td>${r.correct_count??"—"}</td><td>${r.wrong_count??"—"}</td><td><b>${r.score??"—"}</b></td><td>${esc(r.status)}</td><td><button class="mini-action" data-edit="${r.id}">Edit</button> <button class="mini-action danger" data-delete="${r.id}">Hapus</button></td></tr>`).join("");$$("[data-edit]").forEach(b=>b.onclick=()=>editParticipant(rows.find(r=>r.id===b.dataset.edit)));$$("[data-delete]").forEach(b=>b.onclick=async()=>{const r=rows.find(x=>x.id===b.dataset.delete);if(confirm(`Hapus peserta ${r.full_name}? Riwayat ujian peserta ini juga akan terhapus.`)){try{await rpc("admin_delete_participant",{p_id:r.id});toast("Peserta dihapus.");await dashboard();}catch(e){toast(e.message);}}});}
async function editParticipant(r){if(!r)return;const name=prompt("Nama lengkap:",r.full_name);if(name===null)return;const cls=prompt("Kelas:",r.class_name);if(cls===null)return;const no=prompt("Nomor peserta:",r.participant_no);if(no===null)return;const pin=prompt("PIN baru 4–8 angka (kosongkan jika tidak diubah):","");if(pin===null)return;try{await rpc("admin_update_participant",{p_id:r.id,p_name:name,p_class:cls,p_no:no,p_pin:pin||null});toast("Data peserta diperbarui.");await dashboard();}catch(e){toast(e.message);}}
function downloadCSV(rows){const data=[["Nama","Kelas","Nomor Peserta","Benar","Salah","Kosong","Nilai","Status"],...rows.map(r=>[r.full_name,r.class_name,r.participant_no,r.correct_count??"",r.wrong_count??"",r.unanswered_count??"",r.score??"",r.status])];const csv=data.map(row=>row.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download="rekap-asesmen-fikih-2026.csv";a.click();URL.revokeObjectURL(a.href);}
async function init(){if(!configReady()){shell(`<main class="panel narrow"><div class="eyebrow">KONFIGURASI DIPERLUKAN</div><h2>Hubungkan Supabase</h2><p>Isi Project URL dan anon/publishable key pada <code>src/config.js</code>. Jangan gunakan service_role key.</p></main>`);return;}sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);if(!(await restoreSession()))landing();}
init();
</script></body></html>
